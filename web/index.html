term marks and CAPS levels, run checks, and download a clean Excel file. Your marks stay in your browser. Free for 2 weeks, then R79 a month. Please enable JavaScript to use the app.</p><h2>Questions teachers ask</h2><h3>Is my data safe?</h3><p>Gradebook marks are saved in this browser and are not sent to our server. Export the Excel file to keep a copy.</p><h3>What if I clear my browser data?</h3><p>Clearing site data removes the saved marks. Export before you clear it, or before you switch computers.</p><h3>Does it work with SA-SAMS?</h3><p>Kiaat does not connect to SA-SAMS. You export the checked marks and copy them across yourself.</p><h3>What does it cost?</h3><p>Free for 2 weeks, then R79 a month.</p></main></noscript></div><div id="toast" role="status" aria-live="polite"></div><div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="Close dialog">×</button></div><div id="modal-content"></div></div></div></body></html>
